<style>

function parseStructuredIntake(text){
 const aliases={projectName:["project name","projektname"],oneLiner:["one-liner","one liner"],problem:["problem","business problem","problembeschreibung"],businessOutcome:["business outcome","outcome","geschäftsergebnis"],targetUsers:["target users","zielgruppe"],projectType:["project type","projektart"],userRoles:["user roles","users and roles","rollen"],currentWorkflow:["current workflow","aktueller workflow","ist-zustand"],dataSources:["data sources","datenquellen"],businessRules:["business rules","geschäftsregeln"],edgeCases:["edge cases and risks","edge cases","risiken und edge cases"],techPreferences:["technical preferences","tech preferences","technische präferenzen"],integrations:["existing tools and integrations","tools and integrations","bestehende tools und integrationen"],successMetrics:["acceptance and success criteria","acceptance criteria","success criteria","abnahmekriterien"],nonGoals:["non-goals","non goals","nicht-ziele"],constraints:["constraints","einschränkungen"],knownRisks:["known risks","bekannte risiken"],chatHistory:["relevant chat or source context","source context","chat context"]};
 const out={},parts=String(text||"").replace(/\r/g,"").split(/^#{1,4}\s+/m).filter(Boolean);
 for(const part of parts){const lines=part.split("\n"),head=lines.shift().trim().toLowerCase().replace(/[:*`]/g,"");const body=lines.join("\n").trim();for(const [key,names] of Object.entries(aliases)){if(names.some(n=>head===n||head.startsWith(n+" "))){out[key]=body;break}}}
 if(!Object.keys(out).length){String(text||"").split(/\n(?=[A-Za-zÄÖÜäöü][^\n:]{2,45}:)/).forEach(block=>{const m=block.match(/^([^:]+):\s*([\s\S]*)$/);if(!m)return;const head=m[1].trim().toLowerCase(),body=m[2].trim();for(const [key,names] of Object.entries(aliases)){if(names.includes(head)){out[key]=body;break}}})}
 const type=String(out.projectType||"").toLowerCase();if(type){out.projectType=type.includes("web")?"website":type.includes("dashboard")?"dashboard":type.includes("integr")||type.includes("automat")?"integration":type.includes("mobile")?"mobile":type.includes("platform")||type.includes("saas")?"platform":"workflow-tool"}
 const users=String(out.targetUsers||"").toLowerCase();if(users)out.targetUsers=users.includes("external")||users.includes("customer")||users.includes("kunde")?"external":users.includes("only me")||users.includes("personal")||users.includes("nur ich")?"micro":"internal";
 return out;
}

 workspaceFiles=new Map();const folderCounts={},extCounts={},signals=new Set(),risks=[];let folders=0,totalBytes=0,truncated=false;const maxFiles=num(state.workspace.limits.maxFiles,5000);

function filled(v,n=8){return String(v||"").trim().length>=n}
function discoveryDiagnostics(){
 const i=state.intake,e=state.economics;const checks=[
  ["Problem",filled(i.problem,20),"Konkreter heutiger Schaden und Ursache"],
  ["Nutzer & Rollen",filled(i.userRoles,12),"Nutzer, Rechte und Verantwortung"],
  ["Ist-Workflow",filled(i.currentWorkflow,20),"Tatsächlicher Ablauf statt Wunschbild"],
  ["Erfolgskriterien",filled(i.successMetrics,15),"Messbare Abnahme"],
  ["Datenquellen",filled(i.dataSources,12),"Quellen und Datenverantwortung"],
  ["Business Rules",filled(i.businessRules,12),"Verbindliche fachliche Regeln"],
  ["Risiken & Edge Cases",filled(i.edgeCases||i.knownRisks,12),"Fehlerfälle und geschützte Bereiche"],
  ["Nicht-Ziele",filled(i.nonGoals,8),"Explizite Scope-Grenzen"],
  ["Business Evidence",!businessValidation().commercial||businessValidation().ready,"Nur bei kommerziellen Projekten erforderlich"]
 ];
 const ready=checks.filter(x=>x[1]).length;return {checks,ready,total:checks.length,score:Math.round(ready/checks.length*100),blocked:checks.filter(x=>!x[1])};
}
function repositoryHealth(){
 const scan=state.workspace.scan||{};const paths=(scan.previewFiles||[]).map(x=>String(x).toLowerCase());const all=Array.from(workspaceFiles.keys()).map(x=>x.toLowerCase());
 const pool=all.length?all:paths;const dupNames={};pool.forEach(p=>{const n=p.split('/').pop();(dupNames[n]??=[]).push(p)});
 const duplicates=Object.values(dupNames).filter(v=>v.length>1&&!['readme.md','index.ts','index.js','package.json'].includes(v[0].split('/').pop())).length;
 const oldPacks=pool.filter(p=>p.includes('architect-pack')||p.includes('pack-')).length;
 const tests=pool.filter(p=>/(^|\/)(test|tests|__tests__|spec)(\/|\.|$)/.test(p)).length;
 const docs=pool.filter(p=>p.endsWith('.md')).length;const secrets=pool.filter(p=>/(\.env|secret|credential|service[-_]?key)/.test(p)).length;
 const stale=pool.filter(p=>/(backup|copy|old|archive|deprecated|before-|final-final)/.test(p)).length;
 const items=[
  ["Methodenstand",state.workspace.methodStatus==='current'?100:state.workspace.methodStatus==='outdated'?55:20,state.workspace.methodStatus],
  ["Test-Signale",tests?Math.min(100,45+tests*5):15,`${tests} Testpfade`],
  ["Dateihygiene",Math.max(15,100-duplicates*12-stale*5),`${duplicates} mögliche Duplikate, ${stale} Altdateien`],
  ["Secret-Risiko",secrets?35:90,secrets?`${secrets} sensible Dateinamen`:'keine einfachen Signale'],
  ["Dokumentation",docs?Math.min(100,40+docs*2):20,`${docs} Markdown-Dateien`],
  ["Pack-Historie",oldPacks?Math.min(100,45+oldPacks*3):30,`${oldPacks} Pack-Signale`]
 ];
 return {items,score:Math.round(items.reduce((a,x)=>a+x[1],0)/items.length),duplicates,stale,secrets,tests,docs,oldPacks};
}
function packReadiness(){
 const d=discoveryDiagnostics(),c=complexity(),bv=businessValidation();const dims=[
  ["Discovery",d.score],
  ["Business",bv.commercial?Math.round(bv.filled/bv.total*100):100],
  ["Architecture",state.decisions.length?Math.min(100,40+state.decisions.filter(x=>x.selectedAlternativeId).length*25):20],
  ["Risks",filled(state.intake.edgeCases||state.intake.knownRisks,12)?80:25],
  ["Backlog",state.backlog.length?Math.min(100,35+state.backlog.length*10):15],
  ["Evidence",Math.round(Object.values(state.quality.evidence).filter(v=>filled(v,12)).length/Object.keys(state.quality.evidence).length*100)]
 ];
 const overall=Math.round(dims.reduce((a,x)=>a+x[1],0)/dims.length);const valid=d.blocked.length===0&&!c.under&&(!bv.commercial||bv.ready)&&state.decisions.some(x=>x.selectedAlternativeId)&&state.backlog.some(x=>x.priority==='Must');
 return {dims,overall,valid,missing:[...d.blocked.map(x=>x[0]),...(c.under?[`Profil mindestens ${c.min}`]:[]),...(state.decisions.some(x=>x.selectedAlternativeId)?[]:['Freigegebene Architekturentscheidung']),...(state.backlog.some(x=>x.priority==='Must')?[]:['Must-Have im Backlog'])]};
}
function recoveryAdvice(){

 if(h.secrets){title='Sicherheitsbaseline vor Onboarding';actions=['Sensible Dateien und Secrets identifizieren','Git-Historie und .gitignore prüfen','Keine Schlüssel in Packs oder Reports kopieren','Danach Repository Survey fortsetzen'];}

 else if(i.workflowMode==='existing-feature'){title='Feature-Delta isolieren';actions=['Ist-Verhalten und betroffene Module verifizieren','Nicht betroffene Bereiche als geschützt markieren','Akzeptanz und Rollback definieren','Kleinen Feature-Pack erzeugen'];}
 return {level:'warn',title,actions};
}

function slug(s){return String(s||"project").toLowerCase().normalize("NFKD").replace(/[\u0300-\u036f]/g,"").replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"")||"project"}

const CRC_TABLE=(()=>{const t=new Uint32Array(256);for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=(c&1)?0xedb88320^(c>>>1):c>>>1;t[n]=c>>>0}return t})();
function crc32(bytes){let c=0xffffffff;for(const b of bytes)c=CRC_TABLE[(c^b)&255]^(c>>>8);return (c^0xffffffff)>>>0}
function u16(n){return [n&255,(n>>>8)&255]}function u32(n){return [n&255,(n>>>8)&255,(n>>>16)&255,(n>>>24)&255]}
function makeZip(files){const enc=new TextEncoder(),chunks=[],central=[];let offset=0;const push=a=>{const u=a instanceof Uint8Array?a:new Uint8Array(a);chunks.push(u);offset+=u.length};Object.entries(files).forEach(([name,content])=>{const nb=enc.encode(name),data=enc.encode(content),crc=crc32(data),localOffset=offset;const local=new Uint8Array([...u32(0x04034b50),...u16(20),...u16(0),...u16(0),...u16(0),...u16(0),...u32(crc),...u32(data.length),...u32(data.length),...u16(nb.length),...u16(0),...nb]);push(local);push(data);central.push({nb,data,crc,localOffset})});const centralStart=offset;central.forEach(x=>push(new Uint8Array([...u32(0x02014b50),...u16(20),...u16(20),...u16(0),...u16(0),...u16(0),...u16(0),...u32(x.crc),...u32(x.data.length),...u32(x.data.length),...u16(x.nb.length),...u16(0),...u16(0),...u16(0),...u16(0),...u32(0),...u32(x.localOffset),...x.nb])));const centralSize=offset-centralStart;push(new Uint8Array([...u32(0x06054b50),...u16(0),...u16(0),...u16(central.length),...u16(central.length),...u32(centralSize),...u32(centralStart),...u16(0)]));return new Blob(chunks,{type:"application/zip"})}
function exportZip(){const files=buildFiles(),blob=makeZip(files),a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=`${slug(state.intake.projectName||"project")}-launcher-v4.4.1.zip`;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);toast(`ZIP erstellt: ${Object.keys(files).length} Dateien`,"ok")}
function readStoredZip(bytes){const dv=new DataView(bytes.buffer,bytes.byteOffset,bytes.byteLength),dec=new TextDecoder();let p=0;const out={};while(p+30<=bytes.length&&dv.getUint32(p,true)===0x04034b50){const flags=dv.getUint16(p+6,true),method=dv.getUint16(p+8,true),comp=dv.getUint32(p+18,true),nameLen=dv.getUint16(p+26,true),extraLen=dv.getUint16(p+28,true);if(flags&8)throw new Error("Data descriptor unsupported");if(method!==0)throw new Error("Only uncompressed launcher ZIPs are supported");const name=dec.decode(bytes.slice(p+30,p+30+nameLen));const start=p+30+nameLen+extraLen;out[name]=dec.decode(bytes.slice(start,start+comp));p=start+comp}return out}
async function importProject(file){try{let obj;if(file.name.toLowerCase().endsWith(".zip")){const files=readStoredZip(new Uint8Array(await file.arrayBuffer()));const key=Object.keys(files).find(k=>k.endsWith("/project-state.json")||k==="project-state.json");if(!key)throw new Error("project-state.json fehlt");obj=JSON.parse(files[key])}else obj=JSON.parse(await file.text());state=normalizeState(obj);activeView=state.ui.lastView||"dashboard";save();toast("Projekt geöffnet.","ok")}catch(err){console.error(err);toast(`Import fehlgeschlagen: ${err.message}`,"bad")}}
